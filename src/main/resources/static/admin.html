<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARB ADMIN</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/admin.css"><script src="/js/security.js"></script><script src="/js/admin.js" defer></script></head>
<body class="admin-page"><header class="topbar"><a class="brand" href="/admin">A//ARB ADMIN</a><nav class="admin-nav"><a class="admin-button admin-button-ghost" href="/">일반 화면</a><form action="/logout" method="post"><button class="admin-button admin-button-ghost">로그아웃</button></form></nav></header>
<main class="container"><section class="hero"><div><p class="eyebrow">PRIVATE OPERATIONS</p><h1>사용자 운영<br><em>관리 콘솔.</em></h1><p class="hero-copy">API 키 원문과 주문 대행 없이 상태·손익·자동매매를 관리합니다.</p></div></section>
<section class="panel"><div class="panel-head"><div><p>USERS</p><h2>사용자 현황</h2></div><div class="admin-toolbar"><button id="invite" class="admin-button admin-button-primary">+ 초대코드 생성</button><button id="refresh" class="admin-button admin-button-secondary">↻ 새로고침</button><span class="toolbar-divider"></span><button id="stopAll" class="admin-button admin-button-danger">■ 전체 비상정지</button></div></div><p id="inviteResult" class="invite-result"></p><div id="users" class="table-wrap"></div></section>
<section class="panel"><div class="panel-head"><div><p>AUDIT</p><h2>관리자 감사 로그</h2></div></div><div id="audits" class="table-wrap"></div></section>
<section class="panel"><div class="panel-head"><div><p>BACKUP</p><h2>데이터베이스 백업</h2></div><button id="backupNow" class="admin-button admin-button-secondary">＋ 지금 백업</button></div><div id="backups" style="padding:24px"></div></section>
<section class="panel"><div class="panel-head"><div><p>EXCHANGE API</p><h2>요청 제한·실패 현황</h2></div></div><div id="apiMetrics" style="padding:24px"></div></section>
<section class="panel"><div class="panel-head"><div><p>SECURITY</p><h2>관리자 비밀번호 변경</h2></div></div><div class="password-form"><input id="currentPassword" type="password" placeholder="현재 비밀번호"><input id="newPassword" type="password" placeholder="새 비밀번호 (10자 이상)"><button id="changePassword" class="admin-button admin-button-secondary">비밀번호 변경</button><p id="passwordMessage"></p></div></section></main></body></html>
