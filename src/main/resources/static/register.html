<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 — ARB KOREA</title>


    <link rel="stylesheet" href="/css/auth.css"><script src="/js/security.js"></script><script src="/js/auth.js" defer></script>
</head>
<body data-page="register">
<main class="auth-shell">
    <section class="auth-copy"><a class="auth-brand" href="/login"><b>A//</b> ARB KOREA</a><p>CREATE PRIVATE ACCOUNT</p><h1>한 사람을 위한<br><em>거래 연구실.</em></h1><span>비밀번호는 BCrypt로 단방향 암호화됩니다.</span></section>
    <section class="auth-card">
        <p class="eyebrow">NEW ACCOUNT</p><h2>회원가입</h2>
        <div id="authMessage" class="auth-message" role="alert"></div>
        <form id="registerForm" class="auth-form">
            <label><span>표시 이름</span><input id="displayName" autocomplete="name" maxlength="50" required></label>
            <label><span>아이디</span><input id="username" autocomplete="username" minlength="4" maxlength="40" pattern="[a-z0-9][a-z0-9._-]{3,39}" required><small>영문 소문자·숫자, 4자 이상</small></label>
            <label><span>비밀번호</span><input id="password" type="password" autocomplete="new-password" minlength="10" required><small>10자 이상</small></label>
            <label><span>비밀번호 확인</span><input id="passwordConfirm" type="password" autocomplete="new-password" minlength="10" required></label>
            <label><span>관리자 초대코드</span><input id="inviteCode" autocomplete="off" required><small>관리자에게 받은 24시간 초대코드</small></label>
            <button id="registerButton" type="submit">계정 만들기</button>
        </form>
        <p class="auth-switch">이미 계정이 있나요? <a href="/login">로그인</a></p>
    </section>
</main>
</body>
</html>
